[package]
name = "xivlegacy-launcher"
description = "XIVLegacy: one program that sets up FFXIV 1.23b and joins a private server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "XIVLegacy"
path = "src/main.rs"

[dependencies]
xivlegacy-install = { path = "../install" }
anyhow = "1"
blowfish = "0.9"
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[target.'cfg(windows)'.dependencies]
hex = "0.4"
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
