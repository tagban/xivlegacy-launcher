[package]
name = "xivlegacy-launcher"
description = "XIVLegacy: one program that sets up FFXIV 1.23b and joins a private server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "XIVLegacy"
path = "src/main.rs"

[dependencies]
xivlegacy-install = { path = "../install" }
xivlegacy-recomp = { path = "../recomp" }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
blowfish = "0.9"
hex = "0.4"
sha2 = "0.10"
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
# Linux: the Secret Service (GNOME Keyring, KWallet) over D-Bus in pure Rust; config.rs falls
# back to a private file when no Secret Service answers
keyring = { version = "3", features = ["windows-native", "apple-native", "async-secret-service", "async-io", "crypto-rust"] }
gilrs = "0.11"
png = "0.17"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
flate2 = "1"

# Linux: windows on X11 and Wayland (winit loads either at run time)
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
